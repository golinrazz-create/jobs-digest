name: Jobs Digest 12h

on:
  schedule:
    # Запуск каждые 12 часов: в 06:00 и 18:00 UTC (09:00 и 21:00 по Москве)
    - cron: "0 6,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create config.env from GitHub Secret JOBS_DIGEST
        shell: bash
        run: |
          printf '%s\n' "${{ secrets.JOBS_DIGEST }}" > config.env

      - name: Run digest script
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python send_digest.py

      - name: Save updated state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update digest state"
          git push
